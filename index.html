<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UmbraSyn Ltd | النواة المظلمة للتكنولوجيا والفن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0c;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* خلفية ديستوبية متحركة بسيطة */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }
        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        h1 span {
            color: #a855f7; /* لون بنفسجي سام للنواة */
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }
        .sectors {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #38bdf8; /* أزرق سيان تكنولوجي */
            transition: all 0.3s ease;
        }
        .badge:hover {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }
        .footer {
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>UMBRA<span>SYN</span></h1>
        <p>استوديو مستقل يدمج بين سحر الأنمي، قوة المؤثرات البصرية، وهندسة البرمجيات المتطورة لبناء عتاد المستقبل. نحن نصنع ما وراء الظلال.</p>
        
        <div class="sectors">
            <span class="badge">Anime & VFX</span>
            <span class="badge">Game Development</span>
            <span class="badge">Software Solutions</span>
            <span class="badge">Hardware Core (Soon)</span>
        </div>

        <div class="footer">
            &copy; 2026 UmbraSyn Ltd. جميع الحقوق محفوظة للنواة.
        </div>
    </div>

</body>
</html>
